# Local development database. Use separate credentials for production.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: palianytsia
      POSTGRES_PASSWORD: palianytsia_local
      POSTGRES_DB: palianytsia
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U palianytsia -d palianytsia"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
