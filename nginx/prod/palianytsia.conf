# Palianytsia Bread - production nginx site (HTTP on port 80, no HTTPS yet).
#
# Install on the server:
#   sudo cp nginx/prod/palianytsia.conf /etc/nginx/sites-available/palianytsia
#   sudo ln -s /etc/nginx/sites-available/palianytsia /etc/nginx/sites-enabled/palianytsia
#   sudo nginx -t && sudo systemctl reload nginx
#
# Expects:
#   - the frontend built into /home/pal/pal_website/dist (`bun run build`, no BUILD_OUT_DIR needed)
#   - nginx's user (www-data) able to read that folder, including every folder above it. If /home/pal is
#     private, nginx answers 403. Fix with: sudo setfacl -m u:www-data:x /home/pal
#   - the API running on 127.0.0.1:38417 (API_PORT in .env)
#
# Over plain HTTP the admin session cookie must not be marked Secure, or browsers drop it and
# /admin login appears to succeed but signs you straight out. Run the API WITHOUT NODE_ENV=production
# until HTTPS is set up, then turn it back on. The admin password travels unencrypted in the meantime.

server {
    listen 80;
    listen [::]:80;

    # Requests are matched to this site by the address typed in the browser, so it can sit next to other
    # sites on port 80 without taking over their traffic. Both domains (with and without www) and the
    # server's IP serve the same site. Each domain's DNS A record must point at 185.116.239.107.
    server_name palianytsiabread.com www.palianytsiabread.com
                ukrainianbread.co www.ukrainianbread.co
                185.116.239.107;

    root /home/pal/pal_website/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API: forwarded to the Bun server, which only listens on this machine.
    location /api/ {
        proxy_pass http://127.0.0.1:38417;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Product photos are uploaded one at a time, up to 10 MB each.
        client_max_body_size 12m;
    }

    # Built JS/CSS have a content hash in their name, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else is the single-page app: real files are served as-is, and page addresses such as
    # /buy, /buy/<slug> and /admin/products fall back to index.html. It must never be cached for long,
    # so a new build is picked up straight away.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
