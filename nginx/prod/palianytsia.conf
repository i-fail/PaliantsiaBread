# Palianytsia Bread - production nginx site: HTTPS for palianytsiabread.com and ukrainianbread.co.
#
# Setup order matters, because nginx refuses to load this file until the certificate files exist:
#   1. Get one certificate for all four names (see the certbot commands in the README), using the
#      earlier HTTP-only version of this config, which is still installed at that point.
#   2. Install this file, then: sudo nginx -t && sudo systemctl reload nginx
#
# Expects:
#   - the frontend built into /home/pal/pal_website/dist (`bun run build`, no BUILD_OUT_DIR needed)
#   - nginx's user (www-data) able to read that folder, including every folder above it. If /home/pal is
#     private, nginx answers 403. Fix with: sudo setfacl -m u:www-data:x /home/pal
#   - the API running on 127.0.0.1:38417 (API_PORT in .env), started with NODE_ENV=production so the
#     admin session cookie is marked Secure. That is correct now that the site is served over HTTPS.
#   - /var/www/certbot to exist (used for certificate renewals)

# Port 80: answer certificate renewals, send everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name palianytsiabread.com www.palianytsiabread.com
                ukrainianbread.co www.ukrainianbread.co;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Visitors who use the bare IP address are sent to the main domain (the certificate cannot cover an IP).
server {
    listen 80;
    listen [::]:80;
    server_name 185.116.239.107;

    return 301 https://palianytsiabread.com$request_uri;
}

# Port 443: the site itself. The one certificate covers both domains, with and without www.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name palianytsiabread.com www.palianytsiabread.com
                ukrainianbread.co www.ukrainianbread.co;

    ssl_certificate     /etc/letsencrypt/live/palianytsiabread.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/palianytsiabread.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:palianytsia_ssl:5m;
    ssl_session_timeout 1d;

    # Once everything works over HTTPS, you can tell browsers to always use it (this is hard to undo,
    # so enable it only when sure): add_header Strict-Transport-Security "max-age=31536000" always;

    root /home/pal/pal_website/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API: forwarded to the Bun server, which only listens on this machine.
    location /api/ {
        proxy_pass http://127.0.0.1:38417;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Product photos are uploaded one at a time, up to 10 MB each.
        client_max_body_size 12m;
    }

    # The sitemap is generated by the API from the database, so nginx hands this one address over.
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:38417;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built JS/CSS have a content hash in their name, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else is the single-page app: real files are served as-is, and page addresses such as
    # /buy, /buy/<slug> and /admin/products fall back to index.html. It must never be cached for long,
    # so a new build is picked up straight away.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
